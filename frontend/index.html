<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clipify — فيديوهات فيروسية</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#111;--muted:#666;--p1:#6366f1;--p2:#a855f7;--good:#10b981;--line:#eee;--shadow:0 10px 30px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:800px;margin:auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
h1{font-size:2rem;margin-bottom:8px}h2{font-size:1.3rem;margin-bottom:16px}
.input-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
input,button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid var(--line)}
input{flex:1;min-width:280px;background:#fff}
button{cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(99,102,241,.4)}
.btn-outline{background:#fff;color:var(--ink)}
.hidden{display:none}
.clip{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;animation:pop .4s}
.thumb{aspect-ratio:9/16;background:linear-gradient(135deg,var(--p1),var(--p2));position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.clip-body{padding:16px}
.clip-title{font-weight:600;margin-bottom:12px}
.clip-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--s)*1%), #eee 0);display:grid;place-items:center}
.score::before{content:"";width:34px;height:34px;border-radius:50%;background:#fff}
.score span{position:relative;z-index:1;font-weight:700}
.btn-sm{padding:8px 16px;font-size:.9rem}
.spacer{flex:1}
.progress-bar{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin:16px 0}
.progress-bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .5s}
.steps{font-size:.9rem;color:var(--muted)}.step{padding:8px 0;display:flex;gap:12px}.step.active{color:var(--ink)}.step.done{color:var(--good)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:600px){.input-row{flex-direction:column}input{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
  <header style="text-align:center;margin-bottom:32px">
    <h1>Clipify <span style="font-size:.5em;color:var(--p1)">AI</span></h1>
    <p style="color:var(--muted)">من فيديو طويلة → مقاطع فيروسية جاهزة للنشير</p>
  </header>

  <section class="card">
    <h2>أدخل رابط يوتيوب أو ا.upload فيديو</h2>
    <form id="form" class="input-row">
      <input id="url" type="url" placeholder="https://youtube.com/watch?v=..." required>
      <button type="submit" class="btn-primary">نشير</button>
    </form>
    <p style="color:var(--muted);font-size:.9rem">أو <button type="button" id="fileBtn" class="btn-outline">ارفع من جهازك</button></p>
    <input type="file" id="fileInput" accept="video/*" hidden>
  </section>

  <section class="card hidden" id="processing">
    <h2>جاري المعالجة…</h2>
    <div class="progress-bar"><div id="progress"></div></div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card hidden" id="results">
    <h2> clipsك جاهزة</h2>
    <div id="clips"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const form = $('#form'), url = $('#url'), fileBtn = $('#fileBtn'), fileInput = $('#fileInput');
const processing = $('#processing'), results = $('#results'), clips = $('#clips'), progress = $('#progress'), stepsEl = $('#steps');

const STEPS = [
  {label:"حمّل الفيديو", dur:1000},
  {label:"حلّل الصوت والكلام", dur:1400},
  {label:"اختار اللحظات القوية", dur:1600},
  {label:"قصّ 9:16 بالترجمة", dur:900}
];

fileBtn.onclick = () => fileInput.click();
fileInput.onchange = () => { if(fileInput.files[0]) url.value = fileInput.files[0].name; form.dispatchEvent(new Event('submit')); };

form.onsubmit = async e => {
  e.preventDefault();
  if(!url.value.trim()) return;
  
  form.classList.add('hidden');
  processing.classList.remove('hidden');
  results.classList.add('hidden');
  
  stepsEl.innerHTML = STEPS.map((s,i)=>`<div class="step" id="step${i}">⏳ ${s.label}</div>`).join('');
  progress.style.width = '0%';
  
  for(let i=0;i<STEPS.length;i++){
    const el = document.getElementById(`step${i}`);
    el.className = 'step active'; el.innerHTML = `🔄 ${STEPS[i].label}`;
    progress.style.width = `${Math.round((i+1)/STEPS.length*100)}%`;
    await new Promise(r=>setTimeout(r, STEPS[i].dur));
    el.className = 'step done'; el.innerHTML = `✅ ${STEPS[i].label}`;
  }
  
  const demo = [
    {title:"اللحظة التي تغير كل شيء", dur:"0:42", score:96, thumb:"https://picsum.photos/seed/c1/360/640"},
    {title:"3 حيل لمضاعفة نتائجك", dur:"1:01", score:91, thumb:"https://picsum.photos/seed/c2/360/640"},
    {title:"السر الذي يhiddenه عنك", dur:"0:37", score:88, thumb:"https://picsum.photos/seed/c3/360/640"},
    {title:"الخطأ الذي يرتكبه جميعاً", dur:"0:29", score:84, thumb:"https://picsum.photos/seed/c4/360/640"},
    {title:"رد صادم على سؤال بسيط", dur:"0:51", score:79, thumb:"https://picsum.photos/seed/c5/360/640"},
    {title:"نصيحة ستغير حياتك", dur:"0:58", score:75, thumb:"https://picsum.photos/seed/c6/360/640"}
  ];
  
  clips.innerHTML = demo.map((c,i)=>`<article class="clip" style="animation-delay:${i*80}ms"><div class="thumb"><img src="${c.thumb}" alt=""><span style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,.4);color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem">9:16</span></div><div class="clip-body"><h3 class="clip-title">${c.title}</h3><div class="clip-meta"><div class="score" style="--s:${c.score}"><span>${c.score}</span></div><span style="color:var(--muted);font-size:.75rem">فيروسية</span><span class="spacer"></span><button class="btn-sm btn-outline">حمّل</button><button class="btn-sm btn-primary">نشير</button></div></div></article>`).join('');
  
  processing.classList.add('hidden');
  results.classList.remove('hidden');
};
</script>
</body>
</html>
